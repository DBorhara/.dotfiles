# kitty's ssh kitten (the `ssh` alias in zshrc runs `kitty +kitten ssh`).
#
# Don't keep kitty's own private shared connection; use the ControlMaster
# settings from ~/.ssh/config instead. Then `ssh ilab` in kitty, plain ssh,
# scp, rsync and `nvim scp://ilab/...` all ride ONE connection, so you
# log in (password / Duo) once per hour instead of once per command.
share_connections no
