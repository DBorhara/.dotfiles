# === Terminal / Neovim integration
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB"   # true colour (WezTerm, kitty)
set -g focus-events on                    # lets Neovim autoread on focus
set -g allow-passthrough on               # images in Neovim (snacks.image)
set -sg escape-time 10

# === Basic Options
set -g mouse on
set -g history-limit 10000
set -g status-interval 5
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# === Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# === Splits / windows open in the current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# === Pane Resize
bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5

# === Pane Movement (shared with Neovim)
# In a Neovim pane the keys go to Neovim, which moves between its own splits
# and hands off to tmux at the edge (see nvim/lua/keymaps.lua).
bind -n C-h if -F "#{m/ri:^n?vim$,#{pane_current_command}}" "send-keys C-h" "select-pane -L"
bind -n C-j if -F "#{m/ri:^n?vim$,#{pane_current_command}}" "send-keys C-j" "select-pane -D"
bind -n C-k if -F "#{m/ri:^n?vim$,#{pane_current_command}}" "send-keys C-k" "select-pane -U"
bind -n C-l if -F "#{m/ri:^n?vim$,#{pane_current_command}}" "send-keys C-l" "select-pane -R"
# Ctrl-l is taken, so clear the screen with prefix Ctrl-l
bind C-l send-keys C-l

# === Copy mode (vi keys)
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send -X rectangle-toggle

# === Catppuccin Theme (options must be set before the plugin loads)
set -g @plugin 'catppuccin/tmux'
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_text ' #W'
set -g @catppuccin_window_current_text ' #W'

set -g status-position bottom
set -g status-left-length 100
set -g status-right-length 100
set -g status-left ''
set -g status-right '#{E:@catppuccin_status_application}'
set -ag status-right '#{E:@catppuccin_status_session}'

# === TPM (Tmux Plugin Manager) — keep this last
set -g @plugin 'tmux-plugins/tpm'
run '~/.config/tmux/plugins/tpm/tpm'
